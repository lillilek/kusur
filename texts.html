алка; ч1атулу - нанизать/вешают, зубцы делают из.этих.зубцов нитки делают нитки)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":8,"start":35.827278911564626,"end":43.73250610098305,"startLabel":"0:35.827","endLabel":"0:43.733","transcription":"klápilu klápizdasagi dašːíbunu bugó... bésunu=bugo kráskajas bésnutulu.","translation":"Сделав мотки, их варят с красками.","comment":"моток - калапи (pluralia tantum). (связку=сделав из.связки что.делали, варят краски варят)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":9,"start":43.73250610098305,"end":52.744467120181405,"startLabel":"0:43.733","endLabel":"0:52.744","transcription":"náχagi ʕamá lun=lugo ʕamálzdasagi réčʼenu=bugo gabá, gabá rečʼídasa naχí adámal ləkʼáruni da=gabá rəčʼézə=gi.","translation":"И потом опять клубки делают, потом из этих клубков ковер растягивают [на станок], зовут людей, чтобы растянуть ковер.","comment":"и.потом клубок делают из.клубков расстилали ковер, ковер растягивают потом людей зовут тот ковер растягивать","translationMatch":"exact","commentMatch":"exact","review":false},{"number":10,"start":52.744467120181405,"end":58.58390516112871,"startLabel":"0:52.744","endLabel":"0:58.584","transcription":"co kʷéngi cʼuní, da=gabá rečédəsənaχi bokʼútulu besúnu=bugo.","translation":"Сначала дают поесть, потом растягивают, поднимают и ткут. ","comment":"один пища дают, тот этот как застелили, потом берут ткут","translationMatch":"exact","commentMatch":"exact","review":false},{"number":11,"start":58.58390516112871,"end":63.22319727891156,"startLabel":"0:58.584","endLabel":"1:03.223","transcription":"dabá qʼuráʕan=bu ʕorcʼó χanižó.","translation":"Там нужна расческа и такие приспособления.","comment":"там требуется расческа такие.вещи","translationMatch":"exact","commentMatch":"exact","review":false},{"number":12,"start":63.22319727891156,"end":71.50596371882087,"startLabel":"1:03.223","endLabel":"1:11.506","transcription":"báni ʕorcʼó da=ʕircʼə́duχun gabá bisúnu=bugo báknu báknu do koncá naχá qʼutʼúnu=bu musʼrúdasa žánu.","translation":"Этой расческой колотят, делят ковер и выколачивают полностью, а через месяц подрезают. ","comment":"бить расческа этой.расческой ковер делят побив побив до конца, потом режут через.месяц его (имеется в виду заканчивается то есть делается бахрома)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":13,"start":71.50596371882087,"end":76.56453514739229,"startLabel":"1:11.506","endLabel":"1:16.565","transcription":"hinǯé tʼékta adámaz bu=ʕanára, dab kʼígu sábgu adámgi wénu=wugo, kʼígu adám gúni.","translation":"Один человек не справится, там зовут два-три человека, два держат.","comment":"теперь в.одиночку человек не.может, там два-три человека зовут, два человека держат","translationMatch":"exact","commentMatch":"exact","review":false},{"number":14,"start":76.56453514739229,"end":80.85263038548753,"startLabel":"1:16.565","endLabel":"1:20.853","transcription":"íli ʕagára adámal riqʼí ʕemér adámal lehigásə jácal wácal.","translation":"Или родные [помогают], если дома много людей, есть братья-сестры.","comment":"или родные люди дома много людей если.есть братья сестры","translationMatch":"exact","commentMatch":"exact","review":false},{"number":15,"start":80.85263038548753,"end":83.14253328634086,"startLabel":"1:20.853","endLabel":"1:23.143","transcription":"dázgi bésnu=bu da.","translation":"И они ткали.","comment":"они.тоже ткали, да. ","translationMatch":"exact","commentMatch":"exact","review":false},{"number":16,"start":83.14253328634086,"end":84.70151037700462,"startLabel":"1:23.143","endLabel":"1:24.702","transcription":"aʁáni gabájal lésnu.","translation":"Вот так ковры ткали.","comment":"это ковры ткали.","translationMatch":"exact","commentMatch":"exact","review":false},{"number":17,"start":84.70151037700462,"end":87.87379809763574,"startLabel":"1:24.702","endLabel":"1:27.874","transcription":"hinǯé užé béχtol=bu, kʼucχé ʕemér sikʼ bún=baʕa.","translation":"Люди это оставили и уже ковры не ткут, а тогда делали очень хорошие.","comment":"слышу сик1та а не сик1 (потом уже бросили. теперь очень хорошо делали)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":18,"start":87.87379809763574,"end":91.8347619047619,"startLabel":"1:27.874","endLabel":"1:31.835","transcription":"hinǯé adámasda sán=bu no bésun héčʼo.","translation":"А сейчас люди помнят как, но не ткут.","comment":"сейчас люди знают, но не ткут","translationMatch":"exact","commentMatch":"exact","review":false}],"translations":18,"comments":17},{"name":"kus_2026_hsjn_1958_text_Cock_UPDATED.TextGrid","stem":"kus_2026_hsjn_1958_text_Cock_UPDATED","segments":[{"number":1,"start":51.871100196111136,"end":56.435208333333335,"startLabel":"0:51.871","endLabel":"0:56.435","transcription":"kʷečʼ, ħéraj ebélʲas díe áburab hab ħilʼkílʼ kʷečʼ.","translation":"Песня, которую рассказывала бабушка, петушиная песня (сказка).","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":2,"start":56.435208333333335,"end":59.24429615888806,"startLabel":"0:56.435","endLabel":"0:59.244","transcription":"bé(hi)=bu co ħeléku, adámazul.","translation":"Пришел один петух, людей (чей-то).","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":3,"start":59.24429615888806,"end":62.69464583333333,"startLabel":"0:59.244","endLabel":"1:02.695","transcription":"hab qʼutʼíbe áni me(χa)s, bušújgi bé(hi)=bu hasdá cadáχ.","translation":"Когда он выходил на улицу, кошка тоже пошла за ним.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":4,"start":62.69464583333333,"end":67.5317996378378,"startLabel":"1:02.695","endLabel":"1:07.532","transcription":"bušújd ábuni bé=bu hasdaχún:","translation":"Кошка сказала ему: \"Петух, петух, ты на улицу не выходи!","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":5,"start":67.5317996378378,"end":69.98320519725446,"startLabel":"1:07.532","endLabel":"1:09.983","transcription":"bésːib cer, mun bíqʼu ínzeb","translation":"Придет лиса, тебя украдет\".","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":6,"start":69.98320519725446,"end":74.73947916666667,"startLabel":"1:09.983","endLabel":"1:14.739","transcription":"ʕen čʼʷáni bé=bu də́səd cer, co qʼo čʼʷábu ʕen bušújd.","translation":"Послушал он лису, в один день послушал кот.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":7,"start":78.39525,"end":83.84924808187179,"startLabel":"1:18.395","endLabel":"1:23.849","transcription":"báxurab šːib, bíqʼu únu=bu, bušúj únu náqi báxugeze bu bu(gu) hab ħeléku.","translation":"Вышел на дорогу (петух), украл, кот пошел и спас петуха.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":8,"start":83.84924808187179,"end":86.21947916666666,"startLabel":"1:23.849","endLabel":"1:26.219","transcription":"kʼijíli qʼo žégi bé(hu) bugú bušúj.","translation":"На второй день снова пришла кошка.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":9,"start":86.21947916666666,"end":89.02565114302534,"startLabel":"1:26.219","endLabel":"1:29.026","transcription":"bušújd ábu (bugu):","translation":"Кошка сказала: \"Петух, не выглядывай на улицу\".","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":10,"start":89.02565114302534,"end":92.32429166666667,"startLabel":"1:29.026","endLabel":"1:32.324","transcription":"náχile qʼógi báku=bu ħeléku.","translation":"На следующий день тоже выглянул петух.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":11,"start":92.32429166666667,"end":96.62854166666666,"startLabel":"1:32.324","endLabel":"1:36.629","transcription":"coród únu=bu sa... kʼijíli qʼógi báχu géze bubu curód dab ħeléku.","translation":"Лиса на второй день пошла и обратно вытащила петуха.","comment":"са... = хотел сказать, на третий","translationMatch":"exact","commentMatch":"exact","review":false},{"number":12,"start":96.62854166666666,"end":105.22595317778026,"startLabel":"1:36.629","endLabel":"1:45.226","transcription":"sábili qʼójal bákura me(χa)s curód bíqʼu únu=bu, únu=bu, únu=bu, ríkʼid náqegi sʷéru héčʼu, ħeléku dáni náqe ríqʼibe šʔólu héčʼu.","translation":"На третий день, когда он выглянул, лиса украла его и ушла далеко, назад тоже не смотрела, и петух вот так и не пришел домой.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false}],"translations":12,"comments":1},{"name":"kus_2026_hsjn_1958_text_Fox_UPDATED.TextGrid","stem":"kus_2026_hsjn_1958_text_Fox_UPDATED","segments":[{"number":1,"start":0.0,"end":3.56437641723356,"startLabel":"0:00.000","endLabel":"0:03.564","transcription":"cʼebé be bu háni skázka abú.","translation":"Раньше была такая сказка.","comment":"(впереди была так сказка сказав)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":2,"start":3.56437641723356,"end":7.320548399827785,"startLabel":"0:03.564","endLabel":"0:07.321","transcription":"nižé macʼálduχun čísto, nižé macʼálduχun abúni «marhá».","translation":"На нашем языке, чисто на нашем диалекте говорят «маргьа».","comment":"наш язык чисто наш язык говорят сказка","translationMatch":"exact","commentMatch":"exact","review":false},{"number":3,"start":7.320548399827785,"end":10.461541950113379,"startLabel":"0:07.321","endLabel":"0:10.462","transcription":"«marhá» éto skázka ábuni súnda.","translation":"«маргьа» — так называют сказку.","comment":"сказка это сказка говорят так","translationMatch":"exact","commentMatch":"exact","review":false},{"number":4,"start":10.461541950113379,"end":20.18638980263158,"startLabel":"0:10.462","endLabel":"0:20.186","transcription":"lélugo qʼaicadáχal, qʼaicadáχal cadáχ laʕáni adámal lélu, qʼaicadáχal léwugo cígi, cérʼgi, bácʼgi.","translation":"Люди жили вместе с животными, с гор спустились лиса, медведь и волк. ","comment":"пришли вместе с камнями - значит спустились с гор. къаи еще и семья / те кто вместе живут (пришли с гор, вместе с камнями бывают люди; пришли с ними медведь, лиса и волк)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":5,"start":20.18638980263158,"end":28.116468912015534,"startLabel":"0:20.186","endLabel":"0:28.116","transcription":"helʲ lélu cadáχ, hazúl ħáltʼulel luʕál co χánasuχ: cégi cérʼgi, cégi cérʼgi.","translation":" Они, медведь и лиса, пришли вместе и стали работать у одного богача.","comment":"эти пришли вместе, их работа была у одного богача, медведь и лиса, медведь и лиса","translationMatch":"exact","commentMatch":"exact","review":false},{"number":6,"start":28.116468912015534,"end":37.07224599295845,"startLabel":"0:28.116","endLabel":"0:37.072","transcription":"hazúl bebú ħekuráb co kupá nuħólgi, co kupá súndugi...","translation":"И был у них большой горшок масла, один горшок этого...","comment":"не совсем понятно, какие горшки у них: масло точно, мед или сметана? (у них был ?большой? горшок зерна?, один мешок этого)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":7,"start":37.07224599295845,"end":40.4946352118807,"startLabel":"0:37.072","endLabel":"0:40.495","transcription":"jicʼílʼgi co kupá qʼómgi.","translation":"И кувшин мёда.","comment":"(?(лит.) один мешок сметана?)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":8,"start":40.4946352118807,"end":45.66028695577625,"startLabel":"0:40.495","endLabel":"0:45.660","transcription":"hábgi biqʼutulú hel únlu ħáltʼzə, ħáltʼun lelú hal χánasuχ.","translation":"Они спрятали их и пошли работать, работали у этого богача.","comment":"их.тоже спрятали они пошли работать, работали они у этого богача. ","translationMatch":"exact","commentMatch":"exact","review":false},{"number":9,"start":45.66028695577625,"end":49.166319421737505,"startLabel":"0:45.660","endLabel":"0:49.166","transcription":"hésnə cígi ħáltlu bebú, bácʼgi ħáltlu bebú.","translation":"Потом медведь работал, волк тоже работал.","comment":"потом медведь тоже работал. волк тоже работал. ","translationMatch":"exact","commentMatch":"exact","review":false},{"number":10,"start":49.166319421737505,"end":55.8587597689658,"startLabel":"0:49.166","endLabel":"0:55.859","transcription":"cer siħírab cer co meχás lisénil adámal leχúnu abaca, curód abugó.","translation":"А хитрая лиса однажды увидела, как люди оттуда [из дома] идут и закричала.","comment":"(лиса хитрая лиса одно время идущих людей, увидела людей идущих оттуда. лиса крикнула); гьесны — оговорились, с напряжением; меда и кувшин сметаны","translationMatch":"exact","commentMatch":"exact","review":false},{"number":11,"start":55.8587597689658,"end":57.30213317785136,"startLabel":"0:55.859","endLabel":"0:57.302","transcription":"sas bu bu kʼudáb.","translation":"[Лиса] громко закричала.","comment":"голос сделала большой","translationMatch":"exact","commentMatch":"exact","review":false},{"number":12,"start":57.30213317785136,"end":64.42381005884381,"startLabel":"0:57.302","endLabel":"1:04.424","transcription":"cid abú: «šːíbzə mun ʕéʕerdulu bu?», cer abú: «nižér χánasə wúwugo was, dun ánuwugo cʼar tezí».","translation":"Медведь говорит: «Зачем ты кричишь?», лиса говорит: «У нашего богача сын родился, меня зовут имя ему давать».","comment":"медведь говорит зачем ты кричишь, лиса говорит у нашего богача сын, меня зовут имя ставить","translationMatch":"exact","commentMatch":"exact","review":false},{"number":13,"start":64.42381005884381,"end":68.18844821673855,"startLabel":"1:04.424","endLabel":"1:08.188","transcription":"«šːibíχa buzé, — ábu, — ínčʼukʼun bihenára, niž witʼúwu diwé».","translation":"«Что делать, — говорит, — не пойти нельзя, послали туда».","comment":"что делать говорит, не пойти нельзя, нас послали туда","translationMatch":"exact","commentMatch":"exact","review":false},{"number":14,"start":68.18844821673855,"end":73.3548133483175,"startLabel":"1:08.188","endLabel":"1:13.355","transcription":"riqʼíbi wewú, bájbiqubu xas nuħúl kupídasa.","translation":"Пришла домой и начала с кувшина масла.","comment":"домой пришла, начала она с кувшина масла","translationMatch":"exact","commentMatch":"exact","review":false},{"number":15,"start":73.3548133483175,"end":83.59913968613613,"startLabel":"1:13.355","endLabel":"1:23.599","transcription":"ħicʼə́ kupí dasá kʼómu kupí dasá cudági čʼékʼibebu náqe; abú: «šːibíbebu tʼarabí cʼar?», áburab: «tʼárab», «šːibí tʼára cʼar?», ábura: «bájbixi».","translation":"Потом облизала кувшин меда и кувшин сметаны, опять спрашивает [медведь]: «Ну что, дала имя?», [лиса:] «Дала», [медведь:] «Как назвала?», [лиса] говорит: «Начало».","comment":"мед кувшин и сметаны кувшин потом облизала; опять говорит: что случилось, поставил имя? поставил. что поставил имя? говорить начало","translationMatch":"exact","commentMatch":"exact","review":false},{"number":16,"start":83.59913968613613,"end":88.24486337034666,"startLabel":"1:23.599","endLabel":"1:28.245","transcription":"náχeli qʼo žégi bebú cígi, cérʼgi, bácʼgi ħáltʼlib.","translation":"На другой день опять пришли медведь, лиса и волк работать.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":17,"start":88.24486337034666,"end":93.01073508087298,"startLabel":"1:28.245","endLabel":"1:33.011","transcription":"žégi curód co bahná baláhu bugú, sásbaχu, bórčʼnubu ʁab.","translation":"Лиса снова нашла повод, закричала и побежала.","comment":"ещё раз лиса один повод нашла, крикнула и убежала она","translationMatch":"exact","commentMatch":"exact","review":false},{"number":18,"start":93.01073508087298,"end":99.83195282485256,"startLabel":"1:33.011","endLabel":"1:39.832","transcription":"bacʼə́da abú: «kíbi ánubu mun, cer?», abú: «žégi nižér χánasi was wúwugo».","translation":"Волк спрашивает: «Куда ты идешь, лиса?», [лиса] говорит: «У нашего богача снова сын родился».","comment":"волк спрашивает, куда ты идёшь; лиса говорит: у нашего богача ещё раз родился сын","translationMatch":"exact","commentMatch":"exact","review":false},{"number":19,"start":99.83195282485256,"end":105.10734693877552,"startLabel":"1:39.832","endLabel":"1:45.107","transcription":"«dasúj cʼar tʼéze ánuwu dun; bəčʼábitʼu=bu haz náqebe šólu=bu».","translation":"«Пошла называть, потом отпустили и обратно пришла».","comment":"я не поняла, это она говорит, что вернулась, или это повествование (ему имя ставить иду я; отпустили они, обратно дошёл)","translationMatch":"exact","commentMatch":"exact","review":false},{"number":20,"start":105.10734693877552,"end":109.43956916099773,"startLabel":"1:45.107","endLabel":"1:49.440","transcription":"ábu: «tʼárabi cʼar?»; — «tʼára»; — «šːibí tʼárab?»; — «coróbišːa».","translation":"[Волк] спрашивает: «Дала имя?», [лиса отвечает:] «Дала», [волк:] «Какое?», [лиса:] «Середина».","comment":"говорит: поставил имя? поставил. что поставил? половина; с1ороби — середина","translationMatch":"exact","commentMatch":"exact","review":false},{"number":21,"start":109.43956916099773,"end":111.19675480292989,"startLabel":"1:49.440","endLabel":"1:51.197","transcription":"kupájal čʼéku náqebebu.","translation":"Облизала горшки, пришла обратно.","comment":"мешки облизал, обратно пришёл","translationMatch":"exact","commentMatch":"exact","review":false},{"number":22,"start":111.19675480292989,"end":117.41121703692741,"startLabel":"1:51.197","endLabel":"1:57.411","transcription":"sábili qʼo bébu cer, ħáltʼlukʼun žégi bórčʼnu unúbu ʁab ábutul cʼar tʼéze ánuwu.","translation":"На третий день пришла лиса; опять убежала с работы, сказав, что идет давать имя.","comment":"на третий день пришла лиса; работая, опять убежала, сказала, имя ставить идёт","translationMatch":"exact","commentMatch":"exact","review":false},{"number":23,"start":117.41121703692741,"end":121.65460317460318,"startLabel":"1:57.411","endLabel":"2:01.655","transcription":"sábile qʼógi bébu, ábu: «šːibí tʼaráb cʼar?»; — «suʕáb».","translation":"На третий день пришла, [медведь] говорит: «Ну что, дала имя?»; [лиса ответила:] «Конец».","comment":"третий день пришёл; говорит: что поставила имя? кончилось","translationMatch":"exact","commentMatch":"exact","review":false},{"number":24,"start":121.65460317460318,"end":127.84204081632654,"startLabel":"2:01.655","endLabel":"2:07.842","transcription":"dági ħáltʼigi súʕnu, cérʼgi cígi bácʼgi ára riqʼíli.","translation":"Закончив работу, медведь, лиса и волк пошли домой.","comment":"они работу закончив, лиса, медведь и волк ушли домой","translationMatch":"exact","commentMatch":"exact","review":false},{"number":25,"start":127.84204081632654,"end":129.83448979591836,"startLabel":"2:07.842","endLabel":"2:09.834","transcription":"léhural gúršːural.","translation":"Пришли уставшие.","comment":"пришли уставшие","translationMatch":"exact","commentMatch":"exact","review":false},{"number":26,"start":129.83448979591836,"end":133.63448979591837,"startLabel":"2:09.834","endLabel":"2:13.634","transcription":"da žo burál adámal kunázi kupájal lókʼulelu kʼadí.","translation":"Звери-работники вытащили горшки наверх, чтобы поесть.","comment":"работавшие люди (здесь про животных) кушать, мешки принесли наверх","translationMatch":"exact","commentMatch":"exact","review":false},{"number":27,"start":133.63448979591837,"end":137.56283446712018,"startLabel":"2:13.634","endLabel":"2:17.563","transcription":"bátlu=bu bómbušːgu kupá; sʷéru balárab cer bátulu héčo.","translation":"Нашли пустой горшок; оглянулись, а лисы нет.","comment":"(нашли пустой мешок; покрутились, посмотрели — лису не находят); сверу — крутиться/гулять; прошлись по домам","translationMatch":"exact","commentMatch":"exact","review":false},{"number":28,"start":137.56283446712018,"end":142.6873774829249,"startLabel":"2:17.563","endLabel":"2:22.687","transcription":"hadín curód létʼulu hal sábugu šːib cígi bácʼgi.","translation":"И так лиса обманула их троих [двоих] — медведя и волка.","comment":"и так лиса обманула их троих, медведя и волка","translationMatch":"exact","commentMatch":"exact","review":false}],"translations":28,"comments":27},{"name":"kus_2026_hsjn_1958_text_High_voltage_UPDATED.TextGrid","stem":"kus_2026_hsjn_1958_text_High_voltage_UPDATED","segments":[{"number":1,"start":11.503017828197182,"end":19.61267965698475,"startLabel":"0:11.503","endLabel":"0:19.613","transcription":"ʁab baʕá sundúl son azáralda ičʼnusójalda unqʼójalda incʼíli misʼábileb son.","translation":"Это был тысяча девятьсот девяносто восьмой год.","comment":"сначала говорит на литературном \"микьабилеб сон\", потом поправляется","translationMatch":"exact","commentMatch":"exact","review":false},{"number":2,"start":19.61267965698475,"end":22.074214713298186,"startLabel":"0:19.613","endLabel":"0:22.074","transcription":"kánsi=gi únu χútu=laʕa niž kánsi héčʼugun.","translation":"Света не стало, мы остались без света.","comment":"Перевели как: Свет ушёл и мы остались без света.","translationMatch":"exact","commentMatch":"exact","review":false},{"number":3,"start":22.074214713298186,"end":35.62211589415611,"startLabel":"0:22.074","endLabel":"0:35.622","transcription":"ínzi adám=gi gúru, níž=gu róstul, co ... áncʼgu incʼílʲa šúgu qʼo béču kánsi, niž áral kánsi=buzi, dún=gi cadáχ dir χúduli qʼasúm=gi nurulláħ=gi anwár=gi.","translation":"Некому было идти: обычно сами сельчане чинили провода, 10-15 дней без света были, потом пошли делать свет: я, со мной племянник Касум, Нурулла, Анвар.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":4,"start":35.62211589415611,"end":41.44730003873119,"startLabel":"0:35.622","endLabel":"0:41.447","transcription":"kánsi=buzi lérukʼun, nižéda bátə núħi tʼúrab tel, stalbádasa kʼátsa bórtarab.","translation":"На дороге мы нашли порванный провод, который упал сверху со столба.","comment":"bátə núħi = bátara núħi","translationMatch":"exact","commentMatch":"exact","review":false},{"number":5,"start":41.44730003873119,"end":44.11823077464178,"startLabel":"0:41.447","endLabel":"0:44.118","transcription":"héb stalbádi kʼádi wáχsi gar dun.","translation":"Пришлось мне подниматься на столб.","comment":"гар дун = га́рав дун","translationMatch":"exact","commentMatch":"exact","review":false},{"number":6,"start":44.11823077464178,"end":49.669529474111876,"startLabel":"0:44.118","endLabel":"0:49.670","transcription":"hab tel dažó=bunukʼun, bəčá ber kánsi, tok.","translation":"Когда мы должны были кое-что сделать, дали свет, ток.","comment":"Перевели как: Мы должны были кое-что сделать, как дали свет; bəčár - отпустить, bəčaj - отпусти; бер = бе́гьур; слышу после канси ещё что-то б-образное","translationMatch":"exact","commentMatch":"exact","review":false},{"number":7,"start":49.669529474111876,"end":51.35449911915465,"startLabel":"0:49.670","endLabel":"0:51.354","transcription":"ha tókud dun xʷáʕuraw.","translation":"Этот ток меня откинул.","comment":"","translationMatch":"exact","commentMatch":"missing","review":false},{"number":8,"start":51.35449911915465,"end":55.54799290315131,"startLabel":"0:51.354","endLabel":"0:55.548","transcription":"nu... hiǯégi alláhəs xíxu wátəna, sáʁda χútʼur dun.","translation":"Но Аллах уберёг меня, я живой остался.","comment":"sáʁda - живой. sáʁa - живой","translationMatch":"exact","commentMatch":"exact","review":false},{"number":9,"start":55.54799290315131,"end":58.068607285863635,"startLabel":"0:55.548","endLabel":"0:58.069","transcription":"dab dánu tók=gi rušʼólu.","translation":"Током меня ударило.","   <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('textgrid-data').textContent);
    const els = {
      title: document.getElementById('pageTitle'), query: document.getElementById('query'),
      file: document.getElementById('fileFilter'), status: document.getElementById('status'),
      results: document.getElementById('results'), empty: document.getElementById('empty'),
      errors: document.getElementById('errors'), footer: document.getElementById('footer'),
      ignoreMarks: document.getElementById('ignoreMarks')
    };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const stripMarks = value => value.normalize('NFD').replace(/\p{M}/gu, '');
    const normalize = value => (els.ignoreMarks.checked ? stripMarks(value) : value).toLocaleLowerCase('ru');
    const selectedFields = () => new Set([...document.querySelectorAll('.field:checked')].map(x => x.value));
    const tokens = () => normalize(els.query.value.trim()).split(/\s+/u).filter(Boolean);

    function highlight(value, rawTokens) {
      const text = String(value ?? '');
      if (!rawTokens.length) return escapeHtml(text);
      const ranges = [];
      const normalized = normalize(text);
      for (const token of rawTokens) {
        let from = 0;
        while (token && (from = normalized.indexOf(token, from)) !== -1) {
          ranges.push([from, from + token.length]);
          from += Math.max(1, token.length);
        }
      }
      if (!ranges.length || els.ignoreMarks.checked) return escapeHtml(text);
      ranges.sort((a,b) => a[0]-b[0] || b[1]-a[1]);
      const merged = [];
      for (const range of ranges) {
        const last = merged[merged.length - 1];
        if (last && range[0] <= last[1]) last[1] = Math.max(last[1], range[1]);
        else merged.push(range.slice());
      }
      let out = '', cursor = 0;
      for (const [start,end] of merged) {
        out += escapeHtml(text.slice(cursor,start)) + '<mark>' + escapeHtml(text.slice(start,end)) + '</mark>';
        cursor = end;
      }
      return out + escapeHtml(text.slice(cursor));
    }

    function rowMatches(file, segment, activeFields, searchTokens) {
      if (!searchTokens.length) return true;
      const values = [];
      if (activeFields.has('transcription')) values.push(segment.transcription);
      if (activeFields.has('translation')) values.push(segment.translation);
      if (activeFields.has('comment')) values.push(segment.comment);
      if (activeFields.has('filename')) values.push(file.name);
      const haystack = normalize(values.join('\n'));
      return searchTokens.every(token => haystack.includes(token));
    }

    function render() {
      const activeFields = selectedFields();
      const searchTokens = tokens();
      const selectedFile = els.file.value;
      let htmlOut = '', shownFiles = 0, shownSegments = 0;
      for (let fileIndex = 0; fileIndex < data.files.length; fileIndex++) {
        const file = data.files[fileIndex];
        if (selectedFile !== '*' && String(fileIndex) !== selectedFile) continue;
        const matches = file.segments.filter(segment => rowMatches(file, segment, activeFields, searchTokens));
        if (!matches.length) continue;
        shownFiles += 1; shownSegments += matches.length;
        const rows = matches.map(segment => {
          const warning = segment.review ? '<span class="review" title="Границы translation/comment не полностью совпали с transcription"> ⚠</span>' : '';
          const cell = (value, field) => value
            ? `<td>${activeFields.has(field) ? highlight(value, searchTokens) : escapeHtml(value)}</td>`
            : '<td class="missing">—</td>';
          const transcription = activeFields.has('transcription')
            ? highlight(segment.transcription, searchTokens)
            : escapeHtml(segment.transcription);
          const info = `<div class="segment-info">${segment.number} · ${escapeHtml(segment.startLabel)}–${escapeHtml(segment.endLabel)}${warning}</div>`;
          return `<tr><td>${info}${transcription}</td>` +
            cell(segment.translation, 'translation') + cell(segment.comment, 'comment') + '</tr>';
        }).join('');
        htmlOut += `<section class="file"><h2 class="file-title">${highlight(file.name, activeFields.has('filename') ? searchTokens : [])}` +
          `<span class="file-meta">найдено ${matches.length} из ${file.segments.length}; translation ${file.translations}; comment ${file.comments}</span></h2>` +
          '<div class="table-wrap"><table><colgroup><col class="text"><col class="translation"><col class="comment"></colgroup>' +
          '<thead><tr><th>Транскрипция</th><th>Перевод</th><th>Комментарий</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      }
      els.results.innerHTML = htmlOut;
      els.empty.classList.toggle('hidden', shownSegments !== 0);
      els.status.textContent = `Показано сегментов: ${shownSegments} из ${data.stats.segments}; файлов: ${shownFiles} из ${data.stats.files}`;
    }

    els.title.textContent = 'Кусурский диалект · Тексты';
    els.file.innerHTML = '<option value="*">Все файлы</option>' + data.files.map((f,i) => `<option value="${i}">${escapeHtml(f.name)}</option>`).join('');
    els.footer.textContent = `Создано: ${data.generated}. TextGrid: ${data.stats.files}; сегменты: ${data.stats.segments}; translation: ${data.stats.translations}; comment: ${data.stats.comments}.`;
    if (data.errors.length) {
      els.errors.classList.remove('hidden');
      els.errors.querySelector('summary').textContent = `Не удалось прочитать файлов: ${data.errors.length}`;
      els.errors.querySelector('ul').innerHTML = data.errors.map(e => `<li><b>${escapeHtml(e.file)}</b>: ${escapeHtml(e.message)}</li>`).join('');
    }
    let timer;
    els.query.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 80); });
    els.file.addEventListener('change', render);
    els.ignoreMarks.addEventListener('change', render);
    document.querySelectorAll('.field').forEach(box => box.addEventListener('change', render));
    render(); els.query.focus();
  })();
  </script>
