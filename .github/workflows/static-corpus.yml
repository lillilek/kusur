name: Static corpus checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_static_corpus.py -v
      - run: node tests/static-search.cjs
